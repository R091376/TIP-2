# Render Blueprint — split FE/API for TIP-2 (JWT Bearer auth)
# https://render.com/docs/blueprint-spec
#
# Usage:
#   1. Push this repo to GitHub
#   2. Render Dashboard → New → Blueprint → select repo (or Sync existing)
#   3. Fill secrets marked sync: false (Dashboard prompts)
#   4. Redeploy FE so VITE_API_BASE_URL is baked in
#
# Auth: JWT access token (8h). No session cookies — works on mobile cross-origin.

services:
  # ── Backend (FastAPI / Uvicorn) ───────────────────────────────────────────
  - type: web
    name: tip2-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: TIP_WATCHLIST_STORE
        value: postgres
      - key: TIP_PROFILE
        value: ""
      # 512MB: skip 1m seed (~2.6k bars/symbol) and historical SR backfill at boot
      - key: TIP_TIMEFRAME_1M_ENABLED
        value: "false"
      - key: TIP_PATTERN_SR_BACKFILL_ON_STARTUP
        value: "false"
      # JWT access tokens (Bearer). 8 hours. No cookies.
      - key: JWT_EXPIRE_HOURS
        value: "8"
      - key: JWT_SECRET
        generateValue: true
      - key: TIP_ADMIN_PASSWORD
        value: admin
      - key: TIP_TEST_PASSWORD
        value: test
      - key: TIP_TEST_USERNAME
        value: test
      - key: DATABASE_URL
        sync: false
      - key: UPSTOX_ACCESS_TOKEN
        sync: false
      # Exact FE origin (no trailing slash) for browser CORS
      - key: CORS_ALLOWED_ORIGINS
        value: https://tip2-web.onrender.com,http://localhost:5173

  # ── Frontend (Vite static) ────────────────────────────────────────────────
  - type: web
    name: tip2-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && export VITE_API_BASE_URL="${VITE_API_BASE_URL:-https://${API_HOST:-tip2-api.onrender.com}}" && echo "VITE_API_BASE_URL=$VITE_API_BASE_URL" && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: API_HOST
        fromService:
          name: tip2-api
          type: web
          property: host
      - key: VITE_API_BASE_URL
        value: https://tip2-api.onrender.com
      - key: VITE_FEATURE_TIMEFRAME_1M
        value: "false"

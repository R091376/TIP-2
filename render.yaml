# Render Blueprint — same-origin API + SPA (first-party session cookies)
# https://render.com/docs/blueprint-spec
#
# Why same-origin?
#   Split tip2-web + tip2-api makes TIPSESSION a third-party cookie.
#   Mobile browsers often block it even with SameSite=None; Secure; CORS correct.
#   Google Privacy Sandbox guidance for first-party auth: use same site.
#
# Primary app URL after deploy:
#   https://tip2-api.onrender.com/
#
# tip2-web is kept only as a permanent redirect to the API host so old bookmarks work.
#
# Usage:
#   1. Push this repo to GitHub
#   2. Render Dashboard → New → Blueprint → select repo  (or Sync existing Blueprint)
#   3. Fill secrets marked sync: false
#   4. After deploy, open https://tip2-api.onrender.com/ and login

services:
  # ── Backend + SPA (FastAPI serves Vite dist from /) ───────────────────────
  - type: web
    name: tip2-api
    runtime: python
    plan: free
    region: singapore
    # Repo root so the build can compile frontend/ and install backend/
    rootDir: .
    buildCommand: |
      set -e
      NODE_VERSION=20.18.1
      curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz" -o /tmp/node.tar.xz
      tar -xJf /tmp/node.tar.xz -C /tmp
      export PATH="/tmp/node-v${NODE_VERSION}-linux-x64/bin:$PATH"
      node -v && npm -v
      cd frontend
      npm ci
      # Empty base URL → relative /api + same-host /ws (first-party cookies)
      export VITE_API_BASE_URL=
      npm run build
      cd ../backend
      pip install -r requirements.txt
      rm -rf static
      mkdir -p static
      cp -r ../frontend/dist/. static/
      test -f static/index.html
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: TIP_WATCHLIST_STORE
        value: postgres
      - key: TIP_PROFILE
        value: ""
      # First-party cookies on the API host (SPA + API same origin)
      - key: SESSION_COOKIE_SAMESITE
        value: lax
      - key: SESSION_COOKIE_HTTPS_ONLY
        value: "true"
      - key: TIP_ADMIN_PASSWORD
        value: admin
      - key: TIP_TEST_PASSWORD
        value: test
      - key: TIP_TEST_USERNAME
        value: test
      - key: DATABASE_URL
        sync: false
      - key: UPSTOX_ACCESS_TOKEN
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # Only needed for local Vite → production API; not for same-origin SPA
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:5173,http://127.0.0.1:5173

  # ── Legacy static host → redirect to same-origin app ──────────────────────
  # Keeps https://tip2-web.onrender.com bookmarks working.
  - type: web
    name: tip2-web
    runtime: static
    rootDir: frontend
    buildCommand: mkdir -p dist && printf '%s\n' '<!doctype html><meta http-equiv="refresh" content="0;url=https://tip2-api.onrender.com/"><title>Redirecting…</title><a href="https://tip2-api.onrender.com/">Open TIP-2</a>' > dist/index.html
    staticPublishPath: ./dist
    routes:
      - type: redirect
        source: "/*"
        destination: "https://tip2-api.onrender.com/"

# Render Blueprint — split FE/API for TIP-2
# https://render.com/docs/blueprint-spec
#
# Usage:
#   1. Push this repo to GitHub
#   2. Render Dashboard → New → Blueprint → select repo
#   3. Fill secrets marked sync: false (Dashboard prompts)
#   4. After first deploy, set CORS_ALLOWED_ORIGINS + VITE_API_BASE_URL if not
#      already filled (see comments), then redeploy FE so Vite bakes the API URL.
#
# Service names default to tip2-api / tip2-web — change only if unique on your account.

services:
  # ── Backend (FastAPI / Uvicorn) ───────────────────────────────────────────
  - type: web
    name: tip2-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: TIP_WATCHLIST_STORE
        value: postgres
      - key: TIP_PROFILE
        value: ""
      # Cross-site cookies (static FE on *.onrender.com → API on *.onrender.com)
      - key: SESSION_COOKIE_SAMESITE
        value: none
      - key: SESSION_COOKIE_HTTPS_ONLY
        value: "true"
      - key: TIP_ADMIN_PASSWORD
        value: admin
      - key: TIP_TEST_PASSWORD
        value: test
      - key: TIP_TEST_USERNAME
        value: test
      # Secrets / deploy-specific — set in Dashboard (Blueprint will prompt)
      - key: DATABASE_URL
        sync: false
      - key: UPSTOX_ACCESS_TOKEN
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # After FE is live: https://tip2-web.onrender.com  (no trailing slash list item)
      # Comma-separated if you keep local FE: https://tip2-web.onrender.com,http://localhost:5173
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  # ── Frontend (Vite static) ────────────────────────────────────────────────
  # Static sites: no region, and no plan: free (not valid for runtime: static).
  - type: web
    name: tip2-web
    runtime: static
    rootDir: frontend
    buildCommand: |
      npm ci
      if [ -z "$VITE_API_BASE_URL" ] && [ -n "$API_HOST" ]; then
        export VITE_API_BASE_URL="https://${API_HOST}"
      fi
      echo "Building with VITE_API_BASE_URL=${VITE_API_BASE_URL:-<empty/relative>}"
      npm run build
    staticPublishPath: dist
    # SPA client-side routes
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Hostname of tip2-api (no scheme) — used by buildCommand if VITE_API_BASE_URL unset
      - key: API_HOST
        fromService:
          name: tip2-api
          type: web
          property: host
      # Optional override: full URL e.g. https://tip2-api.onrender.com
      - key: VITE_API_BASE_URL
        sync: false

# Render Blueprint — split FE/API for TIP-2
# https://render.com/docs/blueprint-spec
#
# Usage:
#   1. Push this repo to GitHub
#   2. Render Dashboard → New → Blueprint → select repo
#   3. Fill secrets marked sync: false (Dashboard prompts)
#   4. After first deploy, set CORS_ALLOWED_ORIGINS + VITE_API_BASE_URL if not
#      already filled (see comments), then redeploy FE so Vite bakes the API URL.
#
# Service names default to tip2-api / tip2-web — change only if unique on your account.

services:
  # ── Backend (FastAPI / Uvicorn) ───────────────────────────────────────────
  - type: web
    name: tip2-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: TIP_WATCHLIST_STORE
        value: postgres
      - key: TIP_PROFILE
        value: ""
      # Cross-site cookies (static FE on *.onrender.com → API on *.onrender.com)
      - key: SESSION_COOKIE_SAMESITE
        value: none
      - key: SESSION_COOKIE_HTTPS_ONLY
        value: "true"
      - key: TIP_ADMIN_PASSWORD
        value: admin
      - key: TIP_TEST_PASSWORD
        value: test
      - key: TIP_TEST_USERNAME
        value: test
      # Secrets / deploy-specific — set in Dashboard (Blueprint will prompt)
      - key: DATABASE_URL
        sync: false
      - key: UPSTOX_ACCESS_TOKEN
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # Must match the browser Origin exactly (scheme + host, no trailing slash)
      - key: CORS_ALLOWED_ORIGINS
        value: https://tip2-web.onrender.com,http://localhost:5173

  # ── Frontend (Vite static) ────────────────────────────────────────────────
  # Static sites: no region, no plan: free. Quote rewrite paths (YAML treats * specially).
  - type: web
    name: tip2-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && export VITE_API_BASE_URL="${VITE_API_BASE_URL:-https://${API_HOST:-tip2-api.onrender.com}}" && echo "VITE_API_BASE_URL=$VITE_API_BASE_URL" && npm run build
    staticPublishPath: ./dist
    routes:
      # Existing files (e.g. /assets/*) are served as-is; non-files rewrite to SPA shell.
      # Quote paths — unquoted /* breaks YAML alias parsing.
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: API_HOST
        fromService:
          name: tip2-api
          type: web
          property: host
      # Optional full override, e.g. https://tip2-api.onrender.com
      - key: VITE_API_BASE_URL
        value: https://tip2-api.onrender.com
